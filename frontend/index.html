<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuScholar Studio</title>
    <meta name="description" content="俄语学位论文文风、翻译腔与引用质检工作台" />
    <meta name="theme-color" content="#f6f3ec" />
    <script>
      // Apply the saved/system theme before first paint (avoids a light flash in dark mode).
      try {
        var t = localStorage.getItem('ruscholar.theme');
        document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
