name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (without llama-cpp-python, which needs a native build)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download ru_core_news_sm
      - name: Tests
        env:
          RUSCHOLAR_SKIP_DOTENV: "1"
        run: pytest -q
      - name: Entry points import
        run: |
          python -c "import backend.main, mcp_server.server"
          command -v ruscholar-web ruscholar-mcp

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
