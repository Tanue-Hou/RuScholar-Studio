name: RuScholar CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUSCHOLAR_MODEL_PATH: /tmp/ruscholar-ci-no-model.gguf
      RUSCHOLAR_GPU_LAYERS: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install model-free test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Install Russian language model
        run: python -m spacy download ru_core_news_sm
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run automated tests without native model inference
        run: python -m pytest -q -m 'not local_model' -p no:cacheprovider
      - name: Report Python lint debt (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m ruff check --output-format github .
      - name: Report Python formatting debt (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m ruff format --check .

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:config
      - run: npm run build
