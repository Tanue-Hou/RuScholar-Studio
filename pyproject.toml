[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruscholar-studio"
dynamic = ["version"]
description = "Privacy-first audit and style naturalization workspace for Russian academic writing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "spacy>=3.7.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "numpy>=1.24",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=1.6.5",
    # FastMCP lives at mcp.server.fastmcp only in 1.x; 2.x renamed it (MCPServer).
    "mcp>=1.0.0,<2",
    "pymorphy3>=2.0",
]

[project.optional-dependencies]
# Local GGUF inference (PPL probe, local judge). Heavy native build; optional so
# cloud-only installs and CI do not need a compiler.
local = ["llama-cpp-python>=0.2.75"]
dev = ["pytest>=8", "httpx>=0.27", "pyflakes>=3"]

[project.scripts]
ruscholar-web = "backend.main:run"
ruscholar-mcp = "mcp_server.server:run"

[tool.setuptools]
packages = ["backend", "mcp_server", "services", "naturalization_layer"]

[tool.setuptools.package-data]
naturalization_layer = ["rules/*.json", "calibration/*.json"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
